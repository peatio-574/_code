{% extends 'admin/base.html' %}
{% block title %}修改密码{% endblock %}
{% block crumb %}修改密码{% endblock %}

{% block content %}
<div class="panel" style="max-width:520px; margin:40px auto;">
    <div class="panel-head">修改密码</div>
    <form method="post" style="padding:20px;">
        <div class="form-field" style="margin-bottom:16px;">
            <label>原密码 <em>*</em></label>
            <input class="form-input" type="password" name="old_password"
                   autocomplete="current-password" required>
        </div>
        <div class="form-field" style="margin-bottom:16px;">
            <label>新密码 <em>*</em></label>
            <input class="form-input" type="password" name="new_password"
                   autocomplete="new-password" required minlength="6" placeholder="至少 6 位">
        </div>
        <div class="form-field" style="margin-bottom:20px;">
            <label>确认新密码 <em>*</em></label>
            <input class="form-input" type="password" name="confirm_password"
                   autocomplete="new-password" required minlength="6">
        </div>
        <div class="form-actions" style="padding-top:0;">
            <button type="submit" class="btn btn-primary">保存</button>
        </div>
    </form>
</div>
{% endblock %}
