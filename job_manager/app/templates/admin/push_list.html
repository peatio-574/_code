{% extends "base.html" %}

{% block title %}推送记录 - 聘安途岗推系统{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; height:calc(100vh - 96px); overflow:hidden;">

<!-- 搜索筛选 -->
<div class="card mb-3 flex-shrink-0" style="margin-top:0;">
    <div class="card-body" style="padding-top:0;">
        <form id="searchForm" style="padding-top:8px;">
            <div class="row g-3 mb-3">
                <div class="col-md">
                    <label class="form-label fw-bold">岗位名称：</label>
                    <input type="text" class="form-control" name="keyword_job" placeholder="岗位名称">
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">单位名称：</label>
                    <input type="text" class="form-control" name="keyword_company" placeholder="单位名称">
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">推送学员：</label>
                    <input type="text" class="form-control" name="keyword_student" placeholder="姓名/手机号">
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">推送人：</label>
                    <input type="text" class="form-control" name="keyword_pusher" placeholder="姓名/手机号">
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">是否查看：</label>
                    <select class="form-select filter-select" name="is_read" onchange="applyFilters()">
                        <option value="">全部</option>
                        <option value="1">已查看</option>
                        <option value="0">未查看</option>
                    </select>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2 pt-2">
                <button type="submit" class="btn btn-primary fw-bold">
                    <i class="bi bi-search"></i> 搜索
                </button>
                <a href="{{ url_for('admin.push_page') }}" class="btn btn-secondary btn-reset fw-bold">重置</a>
                <button type="button" class="btn btn-warning fw-bold" id="refreshBtn" title="刷新">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.table.no-data { border: none !important; }
.table.no-data thead th { border-bottom: none !important; }
.table.no-data td { border: none !important; }
</style>

<!-- 推送记录列表 -->
<div class="card d-flex flex-column flex-grow-1" style="min-height:0; overflow:hidden;">
    <div class="card-body p-0" style="flex:1; overflow:auto; min-height:0;">
        <table class="table table-hover align-middle mb-0" style="width:100%; table-layout:fixed;">
            <colgroup>
                <col style="width:15%;">
                <col style="width:15%;">
                <col style="width:12%;">
                <col style="width:12%;">
                <col style="width:15%;">
                <col style="width:10%;">
            </colgroup>
            <thead class="sticky-thead">
                <tr>
                    <th style="padding-left:15px;">岗位名称</th>
                    <th>单位名称</th>
                    <th>推送学员</th>
                    <th>推送人</th>
                    <th>推送时间</th>
                    <th>学员查看</th>
                </tr>
            </thead>
            <tbody id="pushesBody"></tbody>
        </table>
    </div>
    <div class="card-footer page-footer d-flex flex-wrap align-items-center gap-3 px-3 py-2" style="justify-content:flex-start;">
        <div class="d-flex align-items-center gap-3">
            <span class="page-total">共 <strong id="pushTotal">0</strong> 条</span>
            <select class="form-select page-select" id="perPage" onchange="changePerPage()">
                <option value="20" selected>20条/页</option>
                <option value="50">50条/页</option>
                <option value="100">100条/页</option>
            </select>
        </div>
        <nav id="paginationNav"></nav>
        <div class="d-flex align-items-center gap-1">
            <span class="goto-text">前往</span>
            <input type="number" class="form-control goto-input" id="gotoPage" min="1" onkeyup="if(event.key==='Enter')gotoPage()">
            <span class="goto-text">页</span>
            <button type="button" class="btn btn-primary btn-sm" onclick="gotoPage()">跳转</button>
        </div>
    </div>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
let currentPerPage = 20;
let filters = { keyword_job: '', keyword_company: '', keyword_student: '', keyword_pusher: '', is_read: '' };

function buildQuery() {
    let params = new URLSearchParams();
    params.set('page', currentPage);
    params.set('per_page', currentPerPage);
    Object.keys(filters).forEach(k => { if (filters[k]) params.set(k, filters[k]); });
    return params.toString();
}

async function loadPushes() {
    const body = document.getElementById('pushesBody');
    const table = body.closest('table');
    table.classList.add('no-data');
    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">加载中...</td></tr>';
    try {
        const res = await fetch('{{ url_for("admin.push_list") }}?' + buildQuery());
        const data = await res.json();
        renderPushes(data.pushes);
        renderPagination(data.pagination);
    } catch (e) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-5">加载失败</td></tr>';
    }
}

function renderPushes(pushes) {
    const body = document.getElementById('pushesBody');
    const table = body.closest('table');
    if (!pushes || pushes.length === 0) {
        table.classList.add('no-data');
        body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">暂无推送记录</td></tr>';
        return;
    }
    table.classList.remove('no-data');
    body.innerHTML = pushes.map(p => {
        const read = p.is_read
            ? '<span class="badge bg-success">已查看</span>'
            : '<span class="badge bg-warning">未查看</span>';
        return `<tr>
            <td style="padding-left:15px;">${escapeHtml(p.job_name)}</td>
            <td>${escapeHtml(p.company_name)}</td>
            <td>${escapeHtml(p.student)}</td>
            <td>${escapeHtml(p.pusher)}</td>
            <td>${escapeHtml(p.pushed_at)}</td>
            <td>${read}</td>
        </tr>`;
    }).join('');
}

function renderPagination(p) {
    document.getElementById('pushTotal').textContent = p.total;
    document.getElementById('gotoPage').max = p.pages;
    document.getElementById('gotoPage').value = p.page;
    const nav = document.getElementById('paginationNav');
    if (p.pages <= 1) { nav.innerHTML = ''; return; }
    let html = '<ul class="pagination pagination-sm mb-0">';
    html += `<li class="page-item ${p.has_prev ? '' : 'disabled'}"><a class="page-link" href="javascript:void(0)" onclick="goPage(${p.prev_num})">&lt;</a></li>`;
    const left = Math.max(1, p.page - 3), right = Math.min(p.pages, p.page + 3);
    if (left > 1) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goPage(1)">1</a></li>`;
        if (left > 2) html += '<li class="page-item disabled ellipsis"><span class="page-link">...</span></li>';
    }
    for (let i = left; i <= right; i++) {
        html += `<li class="page-item ${i === p.page ? 'active' : ''}"><a class="page-link" href="javascript:void(0)" onclick="goPage(${i})">${i}</a></li>`;
    }
    if (right < p.pages) {
        if (right < p.pages - 1) html += '<li class="page-item disabled ellipsis"><span class="page-link">...</span></li>';
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goPage(${p.pages})">${p.pages}</a></li>`;
    }
    html += `<li class="page-item ${p.has_next ? '' : 'disabled'}"><a class="page-link" href="javascript:void(0)" onclick="goPage(${p.next_num})">&gt;</a></li>`;
    html += '</ul>';
    nav.innerHTML = html;
}

function goPage(page) { currentPage = page; loadPushes(); }
function changePerPage() { currentPerPage = parseInt(document.getElementById('perPage').value, 10); currentPage = 1; loadPushes(); }
function gotoPage() {
    var input = document.getElementById('gotoPage');
    var page = parseInt(input.value, 10);
    if (isNaN(page)) return;
    var max = parseInt(input.max, 10) || 1;
    if (page < 1) page = 1;
    if (page > max) page = max;
    if (page !== currentPage) { currentPage = page; loadPushes(); }
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    applyFilters();
});

function applyFilters() {
    const fd = new FormData(document.getElementById('searchForm'));
    filters.keyword_job = fd.get('keyword_job') || '';
    filters.keyword_company = fd.get('keyword_company') || '';
    filters.keyword_student = fd.get('keyword_student') || '';
    filters.keyword_pusher = fd.get('keyword_pusher') || '';
    filters.is_read = fd.get('is_read') || '';
    currentPage = 1;
    loadPushes();
}

document.getElementById('refreshBtn').addEventListener('click', function() { loadPushes(); });

loadPushes();
</script>
{% endblock %}
