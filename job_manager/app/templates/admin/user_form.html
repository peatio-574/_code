{% extends "base.html" %}

{% block title %}{{ '编辑' if user_obj else '新增' }}管理员 - 聘安途岗推系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-{{ 'pencil' if user_obj else 'person-plus' }}"></i>
                    {{ '编辑' if user_obj else '新增' }}管理员
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" id="userForm" action="{{ url_for('admin.user_edit', id=user_obj.id) if user_obj else url_for('admin.user_add') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <h6 class="text-primary mb-3"><i class="bi bi-person"></i> 基本信息</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="real_name"
                                   value="{{ user_obj.real_name if user_obj else '' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">手机号码 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="phone"
                                   value="{{ user_obj.phone if user_obj else '' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">密码 {% if user_obj %}<span class="text-danger">*</span>{% endif %}</label>
                            <input type="text" class="form-control" name="password"
                                   value="{{ user_obj.password_plain if user_obj and current_user.is_super_admin() else '' }}"
                                   placeholder="{{ '留空则不修改' if user_obj else '默认手机号后6位' }}"
                                   {% if user_obj %}required{% endif %}>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">状态 <span class="text-danger">*</span></label>
                            <select class="form-select" name="is_active" id="is_active" required>
                                <option value="1" {% if not user_obj or user_obj.is_active %}selected{% endif %}>启用</option>
                                <option value="0" {% if user_obj and not user_obj.is_active %}selected{% endif %}>禁用</option>
                            </select>
                        </div>
                    </div>

                    <h6 class="text-primary mb-3 mt-3"><i class="bi bi-shield-lock"></i> 管理员设置</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">校区 <span class="text-danger">*</span></label>
                            <select class="form-select" name="campus_id" required>
                                <option value="">请选择校区</option>
                                {% for campus in campuses if campus.is_active %}
                                <option value="{{ campus.id }}" {% if user_obj and user_obj.campus_id == campus.id %}selected{% endif %}>{{ campus.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">角色</label>
                            <select class="form-select" name="role">
                                <option value="">请选择角色</option>
                                {% for role in roles if role.is_active %}
                                <option value="{{ role.name }}" {% if user_obj and user_obj.role == role.name %}selected{% endif %}>{{ role.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">权限设置 <span class="text-danger">*</span></label>
                            <div class="d-flex align-items-center gap-2 pt-1" style="height:calc(1.5rem + 1px*2 + 0.25rem*2);">
                                <div class="form-check form-check-inline mb-0">
                                    <input type="checkbox" class="form-check-input" name="can_manage_students" id="can_manage_students"
                                           style="width:1.2em;height:1.2em;"
                                           {% if not user_obj or user_obj.can_manage_students %}checked{% endif %}>
                                    <label class="form-check-label" for="can_manage_students">学员管理</label>
                                </div>
                                <div class="form-check form-check-inline mb-0">
                                    <input type="checkbox" class="form-check-input" name="can_push_jobs" id="can_push_jobs"
                                           style="width:1.2em;height:1.2em;"
                                           {% if not user_obj or user_obj.can_push_jobs %}checked{% endif %}>
                                    <label class="form-check-label" for="can_push_jobs">岗位推送</label>
                                </div>
                                <div class="form-check form-check-inline mb-0">
                                    <input type="checkbox" class="form-check-input" name="can_view_jobs" id="can_view_jobs"
                                           style="width:1.2em;height:1.2em;"
                                           {% if not user_obj or user_obj.can_view_jobs %}checked{% endif %}>
                                    <label class="form-check-label" for="can_view_jobs">岗位查看</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">管理员头像</label>
                            <input type="text" class="form-control" name="avatar"
                                   value="{{ user_obj.avatar if user_obj else '' }}" placeholder="头像URL">
                        </div>
                    </div>

                    {% if user_obj and current_user.is_super_admin() %}
                    {% endif %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="userSubmitBtn">
                            <i class="bi bi-check-lg"></i> {{ '更新' if user_obj else '保存' }}
                        </button>
                        <a href="{{ url_for('admin.users_page') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('userForm').addEventListener('submit', function(e) {
    e.preventDefault();
    // 验证权限至少选一项
    var canPush = document.getElementById('can_push_jobs').checked;
    var canView = document.getElementById('can_view_jobs').checked;
    var canManage = document.getElementById('can_manage_students').checked;
    if (!canPush && !canView && !canManage) {
        showToast('请至少选择一项权限', 'danger');
        return;
    }
    var btn = document.getElementById('userSubmitBtn');
    btn.disabled = true;
    var formData = new FormData(this);
    formData.append('csrf_token', '{{ csrf_token }}');
    fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        btn.disabled = false;
        if (data.success) {
            showToast(data.message, 'success');
            setTimeout(function() { window.location.href = '{{ url_for("admin.users_page") }}'; }, 800);
        } else {
            showToast(data.message || '提交失败', 'danger');
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        showToast('提交失败，请重试', 'danger');
      });
});
</script>
{% endblock %}
