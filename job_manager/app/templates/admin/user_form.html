{% extends "base.html" %}

{% block title %}{{ '编辑' if user_obj else '新增' }}用户 - 岗位管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-{{ 'pencil' if user_obj else 'person-plus' }}"></i>
                    {{ '编辑' if user_obj else '新增' }}用户
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="username" 
                                   value="{{ user_obj.username if user_obj else '' }}" 
                                   {{ 'readonly' if user_obj else 'required' }}>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">{{ '新' if user_obj else '' }}密码 {{ '' if user_obj else '<span class="text-danger">*</span>' }}</label>
                            <input type="password" class="form-control" name="password" 
                                   {{ '' if user_obj else 'required' }} minlength="6"
                                   placeholder="{{ '留空则不修改' if user_obj else '默认123456' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">用户类型 <span class="text-danger">*</span></label>
                            <select class="form-select" name="user_type" {{ 'disabled' if user_obj else '' }}>
                                <option value="student" {% if user_obj and user_obj.user_type == 'student' %}selected{% endif %}>学员</option>
                                <option value="admin" {% if user_obj and user_obj.user_type == 'admin' %}selected{% endif %}>管理员</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" class="form-control" name="real_name" 
                                   value="{{ user_obj.real_name if user_obj else '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">手机号</label>
                            <input type="text" class="form-control" name="phone" 
                                   value="{{ user_obj.phone if user_obj else '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" name="email" 
                                   value="{{ user_obj.email if user_obj else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">学历</label>
                            <select class="form-select" name="education">
                                <option value="">请选择</option>
                                <option value="大专" {% if user_obj and user_obj.education == '大专' %}selected{% endif %}>大专</option>
                                <option value="本科" {% if user_obj and user_obj.education == '本科' %}selected{% endif %}>本科</option>
                                <option value="硕士" {% if user_obj and user_obj.education == '硕士' %}selected{% endif %}>硕士</option>
                                <option value="博士" {% if user_obj and user_obj.education == '博士' %}selected{% endif %}>博士</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">专业</label>
                            <input type="text" class="form-control" name="major" 
                                   value="{{ user_obj.major if user_obj else '' }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">意向城市</label>
                            <input type="text" class="form-control" name="intention_city" 
                                   value="{{ user_obj.intention_city if user_obj else '' }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">证书</label>
                            <input type="text" class="form-control" name="certificate" 
                                   value="{{ user_obj.certificate if user_obj else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="form-check mt-2">
                                <input type="checkbox" class="form-check-input" name="is_party_member" 
                                       id="is_party_member" {% if user_obj and user_obj.is_party_member %}checked{% endif %}>
                                <label class="form-check-label" for="is_party_member">党员</label>
                            </div>
                        </div>
                    </div>

                    <!-- 管理员权限（仅管理员类型显示） -->
                    <div class="card bg-light mb-3" id="admin-permissions" style="display: {{ 'block' if user_obj and user_obj.user_type == 'admin' else 'none' }};">
                        <div class="card-header">
                            <h6 class="mb-0"><i class="bi bi-shield-lock"></i> 管理员权限</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" name="can_manage_jobs" 
                                               id="can_manage_jobs" {% if not user_obj or user_obj.can_manage_jobs %}checked{% endif %}>
                                        <label class="form-check-label" for="can_manage_jobs">岗位管理</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" name="can_manage_students" 
                                               id="can_manage_students" {% if user_obj and user_obj.can_manage_students %}checked{% endif %}>
                                        <label class="form-check-label" for="can_manage_students">用户管理</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" name="can_manage_accounts" 
                                               id="can_manage_accounts" {% if user_obj and user_obj.can_manage_accounts %}checked{% endif %}>
                                        <label class="form-check-label" for="can_manage_accounts">系统设置</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" name="can_push_jobs" 
                                               id="can_push_jobs" {% if not user_obj or user_obj.can_push_jobs %}checked{% endif %}>
                                        <label class="form-check-label" for="can_push_jobs">推送岗位</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ '更新' if user_obj else '保存' }}
                        </button>
                        <a href="{{ url_for('admin.users_list') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 根据用户类型显示/隐藏管理员权限
document.querySelector('select[name="user_type"]').addEventListener('change', function() {
    document.getElementById('admin-permissions').style.display = this.value === 'admin' ? 'block' : 'none';
});
</script>
{% endblock %}
