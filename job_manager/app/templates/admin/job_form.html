{% extends "base.html" %}

{% block title %}{{ '编辑' if job_id else '新增' }}岗位 - 聘安途岗推系统{% endblock %}

{% block extra_css %}
<style>
.layui-laydate .laydate-btns-confirm { background: #4a7cf7 !important; border-color: #4a7cf7; color: #fff; }
.layui-laydate .laydate-btns-confirm:hover { background: #3b6cd8 !important; }
.layui-laydate .laydate-selected { background: #4a7cf7 !important; color: #fff !important; }
.layui-laydate td.laydate-selected,
.layui-laydate .laydate-day-selected { background: #4a7cf7 !important; }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-11">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-{{ 'pencil' if job_id else 'plus-circle' }}"></i>
                    {{ '编辑' if job_id else '新增' }}岗位信息
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" id="jobForm" action="{{ url_for('admin.job_edit', id=job_id) if job_id else url_for('admin.job_add') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    
                    <h6 class="text-primary mb-3"><i class="bi bi-building"></i> 公司信息</h6>
                    <div class="row">
                        <div class="col-md mb-3">
                            <label class="form-label">公司名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="company_name" required>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">公司性质</label>
                            <select class="form-select" name="company_type">
                                <option value="">请选择</option>
                                <option value="国企">国企</option>
                                <option value="民企">民企</option>
                                <option value="外企">外企</option>
                                <option value="合资">合资</option>
                                <option value="事业单位">事业单位</option>
                                <option value="政府机关">政府机关</option>
                            </select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">公司规模</label>
                            <select class="form-select" name="company_size">
                                <option value="">请选择</option>
                                <option value="0-20人">0-20人</option>
                                <option value="20-99人">20-99人</option>
                                <option value="100-499人">100-499人</option>
                                <option value="500-999人">500-999人</option>
                                <option value="1000-9999人">1000-9999人</option>
                                <option value="10000人以上">10000人以上</option>
                            </select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">公司行业</label>
                            <input type="text" class="form-control" name="company_industry" placeholder="如：互联网/金融/制造">
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">招聘类型</label>
                            <select class="form-select" name="recruit_type">
                                <option value="">请选择</option>
                                <option value="校园招聘">校园招聘</option>
                                <option value="社会招聘">社会招聘</option>
                                <option value="实习">实习</option>
                            </select>
                        </div>
                    </div>

                    <h6 class="text-primary mb-3 mt-3"><i class="bi bi-briefcase"></i> 职位信息</h6>
                    <div class="row">
                        <div class="col-md mb-3">
                            <label class="form-label">职位名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="job_name" required>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">职位性质</label>
                            <select class="form-select" name="job_nature">
                                <option value="全职" selected>全职</option>
                                <option value="兼职">兼职</option>
                            </select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">职位类别</label>
                            <input type="text" class="form-control" name="job_category">
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">薪资范围</label>
                            <div class="input-group">
                                <input type="text" class="form-control" name="salary_range" placeholder="如：5000-8000">
                                <span class="input-group-text">元/月</span>
                            </div>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">招聘人数</label>
                            <input type="number" class="form-control" name="recruit_count" value="1" min="1">
                        </div>
                    </div>

                    <h6 class="text-primary mb-3 mt-3"><i class="bi bi-list-check"></i> 岗位要求</h6>
                    <div class="row">
                        <div class="col-md mb-3">
                            <label class="form-label">学历要求</label>
                            <select class="form-select" name="education_req">
                                <option value="">不限</option>
                                <option value="大专">大专</option>
                                <option value="本科">本科</option>
                                <option value="硕士">硕士</option>
                                <option value="博士">博士</option>
                            </select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">经验要求</label>
                            <select class="form-select" name="experience_req">
                                <option value="">不限</option>
                                <option value="应届生">应届生</option>
                                <option value="1年以内">1年以内</option>
                                <option value="1-3年">1-3年</option>
                                <option value="3-5年">3-5年</option>
                                <option value="5-10年">5-10年</option>
                                <option value="10年以上">10年以上</option>
                            </select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">专业要求</label>
                            <input type="text" class="form-control" name="major_req">
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">截止日期</label>
                            <input type="text" class="form-control deadline-input" id="deadlinePicker" name="deadline" readonly placeholder="点击选择" style="cursor:pointer;">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">职位描述</label>
                            <textarea class="form-control" name="job_detail" rows="6" style="min-height:120px; line-height:1.7; white-space:pre-wrap;"></textarea>
                        </div>
                    </div>

                    <h6 class="text-primary mb-3 mt-3"><i class="bi bi-geo-alt"></i> 工作地点</h6>
                    <div class="row">
                        <div class="col-md mb-3">
                            <label class="form-label">省份</label>
                            <select class="form-select" name="province" id="province_select"></select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">城市</label>
                            <select class="form-select" name="city" id="city_select"></select>
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">工作地点</label>
                            <input type="text" class="form-control" name="work_location">
                        </div>
                        <div class="col-md mb-3">
                            <label class="form-label">详细地址</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="jobSubmitBtn">
                            <i class="bi bi-check-lg"></i> {{ '更新' if job_id else '保存' }}
                        </button>
                        <a href="{{ url_for('admin.jobs_page') }}{% if request.query_string %}?{{ request.query_string.decode() }}{% endif %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/gh/sentsin/laydate@v5.0.9/dist/laydate.js"></script>
<script>
const JOB_ID = {{ job_id|default(0) }};
const JOB_DATA_URL = '{{ url_for("admin.job_data", id=0) }}';
const csrfToken = '{{ csrf_token }}';

const REGION_FALLBACK = {
    '北京': ['北京'], '天津': ['天津'], '上海': ['上海'], '重庆': ['重庆'],
    '河北': ['石家庄','唐山','保定','廊坊','邯郸','秦皇岛','邢台','沧州'],
    '山西': ['太原','大同','临汾','运城','晋中','长治'],
    '内蒙古': ['呼和浩特','包头','鄂尔多斯','赤峰','通辽'],
    '辽宁': ['沈阳','大连','鞍山','锦州','本溪','丹东'],
    '吉林': ['长春','吉林','延吉','四平'],
    '黑龙江': ['哈尔滨','大庆','齐齐哈尔','牡丹江'],
    '江苏': ['南京','苏州','无锡','常州','南通','扬州','徐州','镇江','泰州','盐城'],
    '浙江': ['杭州','宁波','温州','嘉兴','绍兴','金华','台州','湖州','义乌'],
    '安徽': ['合肥','芜湖','蚌埠','马鞍山','安庆','阜阳'],
    '福建': ['福州','厦门','泉州','漳州','莆田','龙岩'],
    '江西': ['南昌','赣州','九江','上饶','宜春'],
    '山东': ['济南','青岛','烟台','潍坊','临沂','济宁','淄博','威海'],
    '河南': ['郑州','洛阳','开封','南阳','新乡','许昌','安阳'],
    '湖北': ['武汉','宜昌','襄阳','荆州','黄石','十堰'],
    '湖南': ['长沙','株洲','湘潭','衡阳','岳阳','常德'],
    '广东': ['广州','深圳','珠海','佛山','东莞','中山','惠州','汕头','江门','湛江','肇庆'],
    '广西': ['南宁','桂林','柳州','北海','玉林'],
    '海南': ['海口','三亚'],
    '四川': ['成都','绵阳','德阳','宜宾','乐山','南充','泸州','达州'],
    '贵州': ['贵阳','遵义','六盘水','毕节'],
    '云南': ['昆明','大理','曲靖','丽江','玉溪'],
    '西藏': ['拉萨','日喀则'],
    '陕西': ['西安','咸阳','宝鸡','榆林','渭南'],
    '甘肃': ['兰州','天水','酒泉','庆阳'],
    '青海': ['西宁'],
    '宁夏': ['银川','吴忠'],
    '新疆': ['乌鲁木齐','喀什','克拉玛依','伊犁']
};
let REGION_DATA = {};

const provinceSel = document.getElementById('province_select');
const citySel = document.getElementById('city_select');
laydate.render({
    elem: '#deadlinePicker',
    type: 'datetime',
    format: 'yyyy-MM-dd HH:mm:ss',
    lang: 'cn',
    theme: 'default',
    done: function(value) {}
});

function regionShortName(name) {
    return (name || '').replace(/(维吾尔自治区|壮族自治区|回族自治区|特别行政区|自治区|省|市)$/, '');
}
function normalizeLevel(json) {
    const map = {};
    const MUNICIPALITIES = ['北京市', '上海市', '天津市', '重庆市'];
    (json || []).forEach(function(p) {
        const pn = regionShortName(p.name || '');
        if (!pn) return;
        if (MUNICIPALITIES.indexOf(p.name) !== -1) { map[pn] = [pn]; return; }
        map[pn] = (p.children || [])
            .map(function(c) { return c.name && regionShortName(c.name); })
            .filter(function(n) { return n && n !== '市辖区'; });
    });
    return map;
}
function loadRegions() {
    return fetch('https://unpkg.com/province-city-china@8/dist/level.json')
        .then(function(r) { return r.json(); })
        .then(function(json) { REGION_DATA = normalizeLevel(json); })
        .catch(function() { REGION_DATA = REGION_FALLBACK; });
}

function fillProvince(selected) {
    provinceSel.innerHTML = '<option value="">请选择省份</option>';
    var names = Object.keys(REGION_DATA);
    var hasSelected = false;
    names.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === selected) { opt.selected = true; hasSelected = true; }
        provinceSel.appendChild(opt);
    });
    if (selected && !hasSelected) {
        var opt = document.createElement('option');
        opt.value = selected;
        opt.textContent = selected;
        opt.selected = true;
        provinceSel.appendChild(opt);
    }
}

function fillCity(province, selected) {
    citySel.innerHTML = '<option value="">请选择城市</option>';
    if (!province) return;
    var cities = REGION_DATA[province];
    if (!cities || cities.length === 0) cities = [province];
    var added = false;
    cities.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        if (c === selected) { opt.selected = true; added = true; }
        citySel.appendChild(opt);
    });
    if (selected && !added) {
        var opt = document.createElement('option');
        opt.value = selected;
        opt.textContent = selected;
        opt.selected = true;
        citySel.appendChild(opt);
    }
}

provinceSel.addEventListener('change', function() {
    fillCity(this.value, '');
});

function setField(name, val, fallback) {
    var el = document.querySelector('[name="' + name + '"]');
    if (!el) return;
    if (el.tagName === 'SELECT') {
        var has = Array.prototype.some.call(el.options, function(o) { return o.value === String(val == null ? '' : val); });
        if (has) {
            el.value = String(val == null ? '' : val);
        } else if (fallback != null) {
            el.value = fallback;
        } else {
            el.value = el.options[0] ? el.options[0].value : '';
        }
    } else {
        el.value = (val == null ? '' : String(val));
    }
}

function populateJob(d) {
    setField('company_name', d.company_name);
    setField('company_type', d.company_type);
    setField('company_size', d.company_size);
    setField('company_industry', d.company_industry);
    setField('recruit_type', d.recruit_type, '社招');
    setField('job_name', d.job_name);
    setField('job_nature', d.job_nature, '全职');
    setField('job_category', d.job_category);
    setField('salary_range', String(d.salary_range || '').replace('元/月', '').replace('/月', '').trim());
    setField('recruit_count', d.recruit_count == null ? 1 : d.recruit_count);
    setField('education_req', d.education_req);
    setField('experience_req', d.experience_req);
    setField('major_req', d.major_req);
    setField('work_location', d.work_location);
    setField('address', d.address);
    setField('job_detail', d.job_detail);

    var pv = d.province || '';
    fillProvince(pv);
    fillCity(pv, d.city || '');

    if (d.deadline) document.getElementById('deadlinePicker').value = d.deadline;
}

function loadJobData() {
    fetch(JOB_DATA_URL.replace('0', String(JOB_ID)))
        .then(function(r) { return r.json(); })
        .then(function(d) { populateJob(d); })
        .catch(function() { showToast('加载岗位数据失败', 'danger'); });
}

loadRegions().then(function() {
    fillProvince('');
    fillCity('', '');
    if (JOB_ID > 0) loadJobData();
});

// AJAX 提交
document.getElementById('jobForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('jobSubmitBtn');
    btn.disabled = true;
    var formData = new FormData(this);
    formData.append('csrf_token', csrfToken);
    fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        btn.disabled = false;
        if (data.success) {
            showToast(data.message, 'success');
            setTimeout(function() { window.location.href = '{{ url_for("admin.jobs_page") }}' + (window.location.search || ''); }, 800);
        } else {
            showToast(data.message || '提交失败', 'danger');
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        showToast('提交失败，请重试', 'danger');
      });
});
</script>
{% endblock %}
