{% extends "base.html" %}

{% block title %}字典管理 - 聘安途岗推系统{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; height:calc(100vh - 96px); height:calc(100dvh - 96px); overflow:hidden;">

<!-- 搜索筛选 -->
<div class="card mb-3 flex-shrink-0" style="margin-top:0;">
    <div class="card-body" style="padding-top:0;">
        <form id="searchForm" style="padding-top:8px;">
            <div class="d-flex align-items-end gap-3 flex-wrap">
                <div style="flex:0 0 220px;">
                    <label class="form-label fw-bold">关键字：</label>
                    <input type="text" class="form-control form-control-sm" name="keyword" placeholder="字段名称 / 字段英文名" style="height:38px;">
                </div>
                <div class="d-flex gap-2 pb-0">
                    <button type="submit" class="btn btn-primary fw-bold">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                    <a href="{{ url_for('admin.dicts_page') }}" class="btn btn-secondary btn-reset fw-bold">重置</a>
                    <button type="button" class="btn btn-primary fw-bold" onclick="showAddModal()">
                        <i class="bi bi-plus-lg"></i> 新增字段
                    </button>
                    <button type="button" class="btn btn-warning fw-bold" id="refreshBtn" title="刷新">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- 字段列表 -->
<div class="card d-flex flex-column flex-grow-1" style="min-height:0; overflow:hidden;">
    <div class="card-body p-0" style="flex:1; overflow:auto; min-height:0;">
        <style>
        .table.no-data { border: none !important; }
        .table.no-data thead th { border-bottom: none !important; }
        .table.no-data td { border: none !important; }
        </style>
        <table class="table table-hover align-middle mb-0" style="width:100%; table-layout:fixed;">
            <colgroup>
                <col style="width:18%;">
                <col style="width:16%;">
                <col style="width:34%;">
                <col style="width:10%;">
                <col style="width:12%;">
                <col style="width:10%;">
            </colgroup>
            <thead class="sticky-thead">
                <tr>
                    <th style="padding-left:15px; text-align:left;">字段名称</th>
                    <th style="text-align:left;">字段英文名</th>
                    <th style="text-align:left;">枚举值</th>
                    <th style="text-align:center;">状态</th>
                    <th style="text-align:center;">更新时间</th>
                    <th style="text-align:center;">操作</th>
                </tr>
            </thead>
            <tbody id="typesBody"></tbody>
        </table>
    </div>
    <div class="card-footer page-footer d-flex flex-wrap align-items-center gap-3 px-3 py-2" style="justify-content:flex-start;">
        <div class="d-flex align-items-center gap-3">
            <span class="page-total">共 <strong id="typeTotal">0</strong> 条</span>
            <select class="form-select page-select" id="perPage" onchange="changePerPage()">
                <option value="20" selected>20条/页</option>
                <option value="50">50条/页</option>
                <option value="100">100条/页</option>
            </select>
        </div>
        <nav id="paginationNav"></nav>
        <div class="d-flex align-items-center gap-1">
            <span class="goto-text">前往</span>
            <input type="number" class="form-control goto-input" id="gotoPage" min="1" onkeyup="if(event.key==='Enter')gotoPage()">
            <span class="goto-text">页</span>
            <button type="button" class="btn btn-primary btn-sm" onclick="gotoPage()">跳转</button>
        </div>
    </div>
</div>
</div>

<!-- 新增字段弹窗 -->
<div class="modal fade" id="typeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="typeModalTitle"><i class="bi bi-diagram-3"></i> 新增字段</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="typeForm">
                <input type="hidden" name="type_id" id="type_id">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">字段名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" id="type_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">字段英文名 <span class="text-danger">*</span>（英文+下划线）</label>
                        <input type="text" class="form-control" name="code" id="type_code" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">排序</label>
                            <input type="number" class="form-control" name="sort_order" id="type_sort_order" value="0">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">状态</label>
                            <select class="form-select" name="is_active" id="type_is_active">
                                <option value="1" selected>启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const URLS = {
    types: '{{ url_for("admin.dicts_types") }}',
    typeAdd: '{{ url_for("admin.dict_type_add") }}',
    typeToggle: '{{ url_for("admin.dict_type_toggle_status") }}',
    typeDelete: '{{ url_for("admin.dict_type_delete") }}',
    editPage: '{{ url_for("admin.dict_edit_page", type_id=0) }}',
};

let typesCache = [];
let typeModalInstance = null;
let nextTypeSort = 1;
let currentPage = 1;
let currentPerPage = 20;
let keyword = '';

function buildQuery() {
    let params = new URLSearchParams();
    params.set('page', currentPage);
    params.set('per_page', currentPerPage);
    if (keyword) params.set('keyword', keyword);
    return params.toString();
}

async function loadTypes() {
    const body = document.getElementById('typesBody');
    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">加载中...</td></tr>';
    try {
        const res = await fetch(URLS.types + '?' + buildQuery());
        const data = await res.json();
        typesCache = data.types || [];
        nextTypeSort = data.next_sort || 1;
        renderTypes();
        renderPagination(data.pagination);
    } catch (e) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-5">加载失败</td></tr>';
    }
}

function renderTypes() {
    const body = document.getElementById('typesBody');
    const table = document.querySelector('table');
    if (!typesCache || typesCache.length === 0) {
        table.classList.add('no-data');
        body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5">暂无字段数据</td></tr>';
        return;
    }
    table.classList.remove('no-data');
    body.innerHTML = typesCache.map(function(t) {
        const editUrl = URLS.editPage.replace('/0/', '/' + t.id + '/');
        const statusSwitch = `<div class="form-check form-switch" style="display:flex; justify-content:center;">
            <input class="form-check-input" type="checkbox" role="switch" id="status_${t.id}" ${t.is_active ? 'checked' : ''} onchange="toggleTypeStatus(${t.id}, this)">
        </div>`;
        const valuesText = (t.values || []).join('；');
        const valuesCell = '<span style="display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="' + escapeAttr(valuesText) + '">' + escapeHtml(valuesText || '-') + '</span>';
        return '<tr>' +
            '<td style="padding-left:15px; text-align:left;">' + escapeHtml(t.name) + '</td>' +
            '<td style="text-align:left;">' + escapeHtml(t.code) + '</td>' +
            '<td style="text-align:left;">' + valuesCell + '</td>' +
            '<td style="text-align:center;">' + statusSwitch + '</td>' +
            '<td style="text-align:center;">' + escapeHtml(t.updated_at) + '</td>' +
            '<td style="text-align:center;">' +
                '<a href="' + editUrl + '" class="btn btn-sm btn-outline-primary me-1" title="编辑"><i class="bi bi-pencil"></i></a>' +
                '<button type="button" class="btn btn-sm btn-outline-danger btn-del" data-id="' + t.id + '" data-name="' + escapeAttr(t.name) + '" title="删除"><i class="bi bi-trash"></i></button>' +
            '</td>' +
        '</tr>';
    }).join('');
    bindTypeClicks();
}

function bindTypeClicks() {
    document.querySelectorAll('#typesBody .btn-del').forEach(btn => {
        btn.addEventListener('click', function() { deleteType(this.dataset.id, this.dataset.name); });
    });
}

function renderPagination(p) {
    if (!p) return;
    document.getElementById('typeTotal').textContent = p.total;
    document.getElementById('gotoPage').max = p.pages;
    document.getElementById('gotoPage').value = p.page;
    const nav = document.getElementById('paginationNav');
    if (p.pages <= 1) { nav.innerHTML = ''; return; }
    let html = '<ul class="pagination pagination-sm mb-0">';
    html += '<li class="page-item ' + (p.has_prev ? '' : 'disabled') + '"><a class="page-link" href="javascript:void(0)" onclick="goPage(' + p.prev_num + ')">&lt;</a></li>';
    const left = Math.max(1, p.page - 3), right = Math.min(p.pages, p.page + 3);
    if (left > 1) {
        html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goPage(1)">1</a></li>';
        if (left > 2) html += '<li class="page-item disabled ellipsis"><span class="page-link">...</span></li>';
    }
    for (let i = left; i <= right; i++) {
        html += '<li class="page-item ' + (i === p.page ? 'active' : '') + '"><a class="page-link" href="javascript:void(0)" onclick="goPage(' + i + ')">' + i + '</a></li>';
    }
    if (right < p.pages) {
        if (right < p.pages - 1) html += '<li class="page-item disabled ellipsis"><span class="page-link">...</span></li>';
        html += '<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goPage(' + p.pages + ')">' + p.pages + '</a></li>';
    }
    html += '<li class="page-item ' + (p.has_next ? '' : 'disabled') + '"><a class="page-link" href="javascript:void(0)" onclick="goPage(' + p.next_num + ')">&gt;</a></li>';
    html += '</ul>';
    nav.innerHTML = html;
}

function goPage(page) { currentPage = page; loadTypes(); }
function changePerPage() { currentPerPage = parseInt(document.getElementById('perPage').value, 10); currentPage = 1; loadTypes(); }
function gotoPage() {
    var input = document.getElementById('gotoPage');
    var page = parseInt(input.value, 10);
    if (isNaN(page)) return;
    var max = parseInt(input.max, 10) || 1;
    if (page < 1) page = 1;
    if (page > max) page = max;
    if (page !== currentPage) { currentPage = page; loadTypes(); }
}

function showAddModal() {
    document.getElementById('typeForm').reset();
    document.getElementById('type_id').value = '';
    document.getElementById('type_name').value = '';
    document.getElementById('type_code').value = '';
    document.getElementById('type_sort_order').value = nextTypeSort;
    document.getElementById('type_is_active').value = '1';
    document.getElementById('typeModalTitle').innerHTML = '<i class="bi bi-diagram-3"></i> 新增字段';
    typeModalInstance = new bootstrap.Modal(document.getElementById('typeModal'));
    typeModalInstance.show();
}

async function toggleTypeStatus(id, checkbox) {
    const formData = new FormData();
    formData.append('type_id', id);
    formData.append('csrf_token', '{{ csrf_token }}');
    try {
        const res = await fetch(URLS.typeToggle, {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await res.json();
        if (data.success) {
            showToast(data.message, 'success');
            loadTypes();
        } else {
            checkbox.checked = !checkbox.checked;
            showToast(data.message, 'danger');
        }
    } catch (e) {
        checkbox.checked = !checkbox.checked;
        showToast('操作失败', 'danger');
    }
}

async function deleteType(id, name) {
    if (!confirm('确定删除字段【' + name + '】及其下所有枚举值吗？')) return;
    const formData = new FormData();
    formData.append('type_id', id);
    formData.append('csrf_token', '{{ csrf_token }}');
    try {
        const res = await fetch(URLS.typeDelete, { method: 'POST', body: formData });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'danger');
        if (data.success) loadTypes();
    } catch (e) { showToast('删除失败', 'danger'); }
}

document.getElementById('typeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    formData.append('csrf_token', '{{ csrf_token }}');
    try {
        const res = await fetch(URLS.typeAdd, { method: 'POST', body: formData });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'danger');
        if (data.success) {
            typeModalInstance.hide();
            loadTypes();
        }
    } catch (e) { showToast('保存失败', 'danger'); }
});

document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    keyword = (new FormData(this).get('keyword') || '').trim();
    currentPage = 1;
    loadTypes();
});

document.getElementById('refreshBtn').addEventListener('click', function() { loadTypes(); });

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

loadTypes();
</script>
{% endblock %}
