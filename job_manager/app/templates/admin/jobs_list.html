{% extends "base.html" %}

{% block title %}岗位管理 - 聘安途岗推系统{% endblock %}

{% block content %}
<div style="display:flex; flex-direction:column; height:calc(100vh - 96px); overflow:hidden;">

<!-- 搜索筛选 -->
<div class="card mb-3 flex-shrink-0" style="margin-top:0;">
    <div class="card-body" style="padding-top:0;">
        <form id="searchForm" style="padding-top:8px;">
            <div class="row g-3 mb-3">
                <div class="col-md-2">
                    <label class="form-label fw-bold">关键字：</label>
                    <input type="text" class="form-control" name="keyword" placeholder="公司/职位名称">
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">省份：</label>
                    <select class="form-select filter-select" name="province" id="jobProvince" onchange="applyFilters()">
                        <option value="">全部省份</option>
                    </select>
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">城市：</label>
                    <select class="form-select filter-select" name="city" id="jobCity" onchange="applyFilters()">
                        <option value="">全部城市</option>
                    </select>
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">公司性质：</label>
                    <select class="form-select filter-select" name="company_type" onchange="applyFilters()">
                        <option value="">全部</option>
                        {% for ct in ['国企','民企','外企','合资','事业单位','政府机关','上市公司'] %}
                        <option value="{{ ct }}">{{ ct }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">招聘类型：</label>
                    <select class="form-select filter-select" name="recruit_type" onchange="applyFilters()">
                        <option value="">全部</option>
                        {% for rt in ['校园招聘','社会招聘','实习'] %}
                        <option value="{{ rt }}">{{ rt }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">学历要求：</label>
                    <select class="form-select filter-select" name="education" onchange="applyFilters()">
                        <option value="">全部</option>
                        <option value="不限">不限</option>
                        {% for e in ['大专','本科','硕士','博士'] %}
                        <option value="{{ e }}">{{ e }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md">
                    <label class="form-label fw-bold">状态：</label>
                    <select class="form-select filter-select" name="status_filter" onchange="applyFilters()">
                        <option value="active">未过期</option>
                        <option value="expired">已过期</option>
                        <option value="all">全部</option>
                    </select>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2 pt-2">
                <button type="submit" class="btn btn-primary fw-bold">
                    <i class="bi bi-search"></i> 搜索
                </button>
                <a href="{{ url_for('admin.jobs_page') }}" class="btn btn-secondary btn-reset fw-bold">重置</a>
                <a href="{{ url_for('admin.job_add') }}{% if request.query_string %}?{{ request.query_string.decode() }}{% endif %}" class="btn btn-primary fw-bold">
                    <i class="bi bi-plus-lg"></i> 新增岗位
                </a>
                <a href="{{ url_for('admin.job_import') }}" class="btn btn-primary fw-bold">
                    <i class="bi bi-upload"></i> 批量导入
                </a>
                <button type="button" class="btn btn-primary fw-bold" id="batchDeleteBtn">
                    <i class="bi bi-trash"></i> 批量删除
                </button>
                <button type="button" class="btn btn-success fw-bold" id="pushJobBtn" onclick="showPushModal()">
                    <i class="bi bi-send"></i> 岗位推送
                </button>
                <button type="button" class="btn btn-warning fw-bold" id="refreshBtn" title="刷新">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 岗位列表 -->
<div class="card d-flex flex-column flex-grow-1" style="min-height:0; overflow:hidden;">
    <div class="card-body p-0" style="flex:1; overflow:auto; min-height:0;">
        <table class="table table-hover align-middle mb-0" style="width:100%; table-layout:fixed;">
                <colgroup>
                    <col style="width:4%;">
                    <col style="width:12%;">
                    <col style="width:14%;">
                    <col style="width:9%;">
                    <col style="width:7%;">
                    <col style="width:9%;">
                    <col style="width:6%;">
                    <col style="width:11%;">
                    <col style="width:4%;">
                    <col style="width:15%;">
                    <col style="width:9%;">
                </colgroup>
                <thead class="sticky-thead">
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>职位名称</th>
                        <th>公司名称</th>
                        <th>公司性质</th>
                        <th>招聘类型</th>
                        <th>薪资范围</th>
                        <th>学历</th>
                        <th>工作地点</th>
                        <th style="text-align:center;">人数</th>
                        <th>截止时间</th>
                        <th style="text-align:center;">操作</th>
                    </tr>
                </thead>
                <tbody id="jobsBody"></tbody>
        </table>
    </div>
    <div class="card-footer page-footer d-flex flex-wrap align-items-center gap-3 px-3 py-2" style="justify-content:flex-start;">
        <div class="d-flex align-items-center gap-3">
            <span class="page-total">共 <strong id="jobTotal">0</strong> 条</span>
            <select class="form-select page-select" id="perPage" onchange="changePerPage()">
                <option value="20" selected>20条/页</option>
                <option value="50">50条/页</option>
                <option value="100">100条/页</option>
            </select>
        </div>
        <nav id="paginationNav"></nav>
        <div class="d-flex align-items-center gap-1">
            <span class="goto-text">前往</span>
            <input type="number" class="form-control goto-input" id="gotoPage" min="1" onkeyup="if(event.key==='Enter')gotoPage()">
            <span class="goto-text">页</span>
            <button type="button" class="btn btn-primary btn-sm" onclick="gotoPage()">跳转</button>
        </div>
    </div>
</div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal fade" id="deleteJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger"></i> 确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning">
                    <strong>警告：</strong>删除岗位后将无法恢复，此操作不可撤销！
                </div>
                <p>确定要删除岗位 <strong id="delete_job_info"></strong> 吗？</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" onclick="confirmJobDelete()">确认删除</button>
            </div>
        </div>
    </div>
</div>

<!-- 岗位推送弹窗 -->
<style>
#pushJobModal .table { table-layout: auto; border: none; }
#pushJobModal .table td, #pushJobModal .table th { border: none; }
#pushJobModal .table thead th { border-bottom: 1px solid #dee2e6 !important; padding-bottom: 26px !important; }
#pushJobModal .modal-dialog { height: 100vh; display: flex; margin: 0 auto; }
#pushJobModal .modal-content { height: 100%; overflow: hidden; display: flex; flex-direction: column; }
#pushJobModal .modal-body { overflow: hidden; flex: 1; display: flex; flex-direction: column; }
#pushJobModal .student-list-wrap { flex: 1; overflow-y: auto; min-height: 70%; border: none; }
#pushJobModal .modal-footer { border-top: none; }
</style>
<div class="modal fade" id="pushJobModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-send text-success"></i> 岗位推送</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3 d-flex align-items-center gap-2">
                    <label class="form-label fw-bold mb-0">已选岗位：</label>
                    <span id="selectedJobsInfo" class="text-primary fw-bold" style="font-size:14px;">0</span>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">选择校区：</label>
                        <select class="form-select filter-select" id="pushCampusFilter" onchange="loadPushStudents()">
                            <option value="">全部校区</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">关键字搜索：</label>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control" id="pushKeyword" placeholder="姓名/手机号">
                            <button type="button" class="btn btn-primary flex-shrink-0" onclick="filterPushStudents()"><i class="bi bi-search"></i> 搜索</button>
                        </div>
                    </div>
                    <div class="col-md-5 d-flex align-items-end justify-content-end">
                        <span class="text-muted" style="font-size:14px;">已选 <strong id="selectedCount">0</strong> 人</span>
                    </div>
                </div>
                <div class="border rounded student-list-wrap">
                    <table class="table table-hover align-middle mb-0" style="font-size:13px;">
                        <thead class="sticky-thead">
                            <tr>
                                <th style="width:50px;"><input type="checkbox" id="selectAllPushStudents" onchange="toggleAllPushStudents(this.checked)"></th>
                                <th>姓名</th>
                                <th>手机号</th>
                                <th>校区</th>
                                <th>学历</th>
                                <th>专业</th>
                            </tr>
                        </thead>
                        <tbody id="pushStudentsBody">
                            <tr><td colspan="6" class="text-center text-muted py-4">请先选择校区</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success fw-bold" onclick="submitPush()">
                    <i class="bi bi-send"></i> 确认推送
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const JOB_EDIT_URL = '{{ url_for("admin.job_edit", id=0) }}'.replace('0', '');

let currentPage = 1;
let currentPerPage = 20;
let filters = { keyword: '', province: '', city: '', company_type: '', recruit_type: '', education: '', status_filter: 'active' };

function applyFiltersFromUrl() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('keyword')) filters.keyword = params.get('keyword');
    if (params.has('province')) filters.province = params.get('province');
    if (params.has('city')) filters.city = params.get('city');
    if (params.has('company_type')) filters.company_type = params.get('company_type');
    if (params.has('recruit_type')) filters.recruit_type = params.get('recruit_type');
    if (params.has('education')) filters.education = params.get('education');
    if (params.has('status_filter')) filters.status_filter = params.get('status_filter');
    if (params.has('page')) currentPage = parseInt(params.get('page'), 10) || 1;
    if (params.has('per_page')) { const pp = parseInt(params.get('per_page'), 10); if ([20,50,100].includes(pp)) currentPerPage = pp; }
}

function syncFormToFilters() {
    const kw = document.querySelector('#searchForm [name="keyword"]');
    if (kw) kw.value = filters.keyword || '';
    const ct = document.querySelector('#searchForm [name="company_type"]');
    if (ct) ct.value = filters.company_type || '';
    const rt = document.querySelector('#searchForm [name="recruit_type"]');
    if (rt) rt.value = filters.recruit_type || '';
    const ed = document.querySelector('#searchForm [name="education"]');
    if (ed) ed.value = filters.education || '';
    const st = document.querySelector('#searchForm [name="status_filter"]');
    if (st) st.value = filters.status_filter || 'active';
    const per = document.getElementById('perPage');
    if (per) per.value = String(currentPerPage);
}

function buildQuery() {
    let params = new URLSearchParams();
    params.set('page', currentPage);
    params.set('per_page', currentPerPage);
    Object.keys(filters).forEach(k => { if (filters[k]) params.set(k, filters[k]); });
    return params.toString();
}

function updateUrl() {}

async function loadJobs() {
    const body = document.getElementById('jobsBody');
    body.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-5">加载中...</td></tr>';
    try {
        const res = await fetch('{{ url_for("admin.jobs_list") }}?' + buildQuery());
        const data = await res.json();
        renderJobs(data.jobs);
        renderPagination(data.pagination);
    } catch (e) {
        body.innerHTML = '<tr><td colspan="11" class="text-center text-danger py-5">加载失败</td></tr>';
    }
}

function renderJobs(jobs) {
    const body = document.getElementById('jobsBody');
    if (!jobs || jobs.length === 0) {
        body.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-5">暂无岗位数据</td></tr>';
        document.getElementById('selectAll').checked = false;
        return;
    }
    body.innerHTML = jobs.map(job => {
        let deadlineHtml;
        if (job.deadline) {
            deadlineHtml = escapeHtml(job.deadline);
        } else {
            deadlineHtml = '<span class="text-info">长期有效</span>';
        }
        const recruitColorMap = {'校园招聘': 'success', '社会招聘': 'primary', '实习': 'warning'};
        const rc = recruitColorMap[job.recruit_type] || 'secondary';
        const editUrl = JOB_EDIT_URL + job.id + (window.location.search || '');
        return `<tr style="height:50px;" class="${job.is_expired ? 'table-danger' : ''}">
            <td style="padding-left:15px;"><input type="checkbox" name="job_ids" value="${job.id}" class="job-checkbox"></td>
            <td><span class="text-primary fw-normal">${escapeHtml(job.job_name)}</span></td>
            <td>${escapeHtml(job.company_name)}</td>
            <td>${escapeHtml(job.company_type) || '-'}</td>
            <td><span class="badge bg-${rc}">${escapeHtml(job.recruit_type) || '-'}</span></td>
            <td class="text-danger fw-normal">${escapeHtml(formatSalary(job.salary_range))}</td>
            <td>${escapeHtml(job.education_req) || '不限'}</td>
            <td>${escapeHtml(job.location)}</td>
            <td style="text-align:center;">${job.recruit_count}</td>
            <td>${deadlineHtml}</td>
            <td style="text-align:center; white-space:nowrap;">
                <a href="${editUrl}" class="btn btn-sm btn-outline-primary me-1" title="�༭"><i class="bi bi-pencil"></i></a>
                <button type="button" class="btn btn-sm btn-outline-danger" title="ɾ��" onclick="showJobDeleteModal('${job.id}','${escapeAttr(job.job_name)}')"><i class="bi bi-trash"></i></button>
            </td>
        </tr>`;
    }).join('');
    // 全选联动
    document.querySelectorAll('.job-checkbox').forEach(cb => {
        cb.addEventListener('change', function() {
            const all = document.querySelectorAll('.job-checkbox');
            document.getElementById('selectAll').checked = Array.from(all).every(c => c.checked);
        });
    });
}

function renderPagination(p) {
    document.getElementById('jobTotal').textContent = p.total;
    document.getElementById('gotoPage').max = p.pages;
    document.getElementById('gotoPage').value = p.page;
    const nav = document.getElementById('paginationNav');
    if (p.pages <= 1) {
        nav.innerHTML = '';
        return;
    }
    let html = '<ul class="pagination pagination-sm mb-0">';
    html += `<li class="page-item ${p.has_prev ? '' : 'disabled'}"><a class="page-link" href="javascript:void(0)" onclick="goPage(${p.prev_num})">&lt;</a></li>`;
    const left = Math.max(1, p.page - 3);
    const right = Math.min(p.pages, p.page + 3);
    if (left > 1) {
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goPage(1)">1</a></li>`;
        if (left > 2) html += '<li class="page-item disabled ellipsis"><span class="page-link">...</span></li>';
    }
    for (let i = left; i <= right; i++) {
        html += `<li class="page-item ${i === p.page ? 'active' : ''}"><a class="page-link" href="javascript:void(0)" onclick="goPage(${i})">${i}</a></li>`;
    }
    if (right < p.pages) {
        if (right < p.pages - 1) html += '<li class="page-item disabled ellipsis"><span class="page-link">...</span></li>';
        html += `<li class="page-item"><a class="page-link" href="javascript:void(0)" onclick="goPage(${p.pages})">${p.pages}</a></li>`;
    }
    html += `<li class="page-item ${p.has_next ? '' : 'disabled'}"><a class="page-link" href="javascript:void(0)" onclick="goPage(${p.next_num})">&gt;</a></li>`;
    html += '</ul>';
    nav.innerHTML = html;
}

function goPage(page) { currentPage = page; updateUrl(); loadJobs(); }
function changePerPage() { currentPerPage = parseInt(document.getElementById('perPage').value, 10); currentPage = 1; updateUrl(); loadJobs(); }

function gotoPage() {
    var input = document.getElementById('gotoPage');
    var page = parseInt(input.value, 10);
    if (isNaN(page)) return;
    var max = parseInt(input.max, 10) || 1;
    if (page < 1) page = 1;
    if (page > max) page = max;
    if (page !== currentPage) { currentPage = page; updateUrl(); loadJobs(); }
}

function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function escapeAttr(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function formatSalary(v) {
    if (!v) return '-';
    var t = String(v).trim();
    if (/^0\s*[~\-—–]\s*0/.test(t) || /^0\s*0/.test(t)) return '-';
    return v;
}

document.getElementById('searchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    applyFilters();
});

function applyFilters() {
    const fd = new FormData(document.getElementById('searchForm'));
    filters.keyword = fd.get('keyword') || '';
    filters.province = fd.get('province') || '';
    filters.city = fd.get('city') || '';
    filters.company_type = fd.get('company_type') || '';
    filters.recruit_type = fd.get('recruit_type') || '';
    filters.education = fd.get('education') || '';
    filters.status_filter = fd.get('status_filter') || 'active';
    currentPage = 1;
    loadJobs();
}

document.getElementById('refreshBtn').addEventListener('click', function() { loadJobs(); });

document.getElementById('selectAll').addEventListener('change', function() {
    document.querySelectorAll('.job-checkbox').forEach(cb => cb.checked = this.checked);
});

document.getElementById('batchDeleteBtn').addEventListener('click', async function() {
    var checked = document.querySelectorAll('.job-checkbox:checked');
    if (checked.length === 0) { showToast('请选择要删除的岗位', 'warning'); return; }
    if (!confirm('确定删除选中的' + checked.length + ' 个岗位吗？')) return;
    const formData = new FormData();
    formData.append('csrf_token', '{{ csrf_token }}');
    checked.forEach(cb => formData.append('job_ids', cb.value));
    try {
        const res = await fetch('{{ url_for("admin.job_delete") }}', {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'danger');
        if (data.success) loadJobs();
    } catch (e) { showToast('删除失败', 'danger'); }
});

};
let REGION_DATA = {};

function shortName(name) {
  return (name || '').replace(/(维吾尔自治区|壮族自治区|回族自治区|特别行政区|自治区|省|市)$/, '');
}

function normalizeLevel(json) {
  const map = {};
  const MUNICIPALITIES = ['北京市', '上海市', '天津市', '重庆市'];
  (json || []).forEach(p => {
    const pn = shortName(p.name || '');
    if (!pn) return;
    if (MUNICIPALITIES.indexOf(p.name) !== -1) { map[pn] = [pn]; return; }
    map[pn] = (p.children || [])
      .map(c => c.name && shortName(c.name))
      .filter(n => n && n !== '市辖区');
  });
  return map;
}

function fillProvince(selected) {
  const sel = document.getElementById('jobProvince');
  let html = '<option value="">全部省份</option>';
  Object.keys(REGION_DATA).forEach(p => {
    html += `<option value="${p}" ${p === selected ? 'selected' : ''}>${p}</option>`;
  });
  sel.innerHTML = html;
  if (selected) fillCity(selected, '');
}

function fillCity(province, selected) {
  const sel = document.getElementById('jobCity');
  const cities = province ? (REGION_DATA[province] || []) : [];
  let html = '<option value="">全部城市</option>';
  cities.forEach(c => {
    html += `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`;
  });
  sel.innerHTML = html;
}

document.getElementById('jobProvince').addEventListener('change', function() {
  fillCity(this.value, '');
});

function loadRegions() {
  return fetch('https://unpkg.com/province-city-china@8/dist/level.json')
    .then(r => r.json())
    .then(json => { REGION_DATA = normalizeLevel(json); })
    .catch(() => { REGION_DATA = REGION_FALLBACK; })
    .then(function() {
      fillProvince(filters.province);
      if (!filters.province) fillCity('', '');
      else fillCity(filters.province, filters.city);
    });
}

syncFormToFilters();
loadRegions();
loadJobs();
</script>

<script>
let currentDeleteJobId = null;

function showJobDeleteModal(id, jobName) {
    currentDeleteJobId = id;
    document.getElementById('delete_job_info').textContent = jobName;
    new bootstrap.Modal(document.getElementById('deleteJobModal')).show();
}

async function confirmJobDelete() {
    if (!currentDeleteJobId) return;
    const formData = new FormData();
    formData.append('csrf_token', '{{ csrf_token }}');
    formData.append('job_ids', currentDeleteJobId);
    try {
        const res = await fetch('{{ url_for("admin.job_delete") }}', {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await res.json();
        bootstrap.Modal.getInstance(document.getElementById('deleteJobModal')).hide();
        showToast(data.message, data.success ? 'success' : 'danger');
        if (data.success) loadJobs();
    } catch (e) { showToast('删除失败', 'danger'); }
}

/* ---- 岗位推送功能 ---- */
let pushStudents = [];
let selectedStudentIds = new Set();

function getSelectedJobIds() {
    return Array.from(document.querySelectorAll('.job-checkbox:checked')).map(cb => cb.value);
}

function showPushModal() {
    const jobIds = getSelectedJobIds();
    if (jobIds.length === 0) {
        showToast('请先选择要推送的岗位', 'warning');
        return;
    }
    selectedStudentIds.clear();
    updateSelectedCount();
    
    const infoDiv = document.getElementById('selectedJobsInfo');
    infoDiv.textContent = jobIds.length;
    
    loadPushCampuses();
    new bootstrap.Modal(document.getElementById('pushJobModal')).show();
}

async function loadPushCampuses() {
    try {
        const res = await fetch('{{ url_for("admin.campuses_list") }}');
        const data = await res.json();
        const select = document.getElementById('pushCampusFilter');
        let html = '<option value="">全部校区</option>';
        (data.campuses || []).forEach(c => {
            html += `<option value="${escapeAttr(c.name)}">${escapeHtml(c.name)}</option>`;
        });
        select.innerHTML = html;
    } catch (e) {
        console.error('加载校区失败', e);
    }
}

async function loadPushStudents() {
    const campus = document.getElementById('pushCampusFilter').value;
    const body = document.getElementById('pushStudentsBody');
    body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">加载中...</td></tr>';
    
    try {
        let url = '{{ url_for("admin.students_list") }}?per_page=0&status=active';
        if (campus) url += '&campus=' + encodeURIComponent(campus);
        const res = await fetch(url);
        const data = await res.json();
        pushStudents = data.students || [];
        renderPushStudents(pushStudents);
    } catch (e) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">加载失败</td></tr>';
    }
}

function renderPushStudents(students) {
    const body = document.getElementById('pushStudentsBody');
    if (!students || students.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无学员数据</td></tr>';
        return;
    }
    body.innerHTML = students.map(s => {
        const checked = selectedStudentIds.has(s.id) ? 'checked' : '';
        return `<tr>
            <td style="padding-left:15px;"><input type="checkbox" value="${s.id}" class="push-student-checkbox" ${checked} onchange="togglePushStudent(${s.id}, this.checked)"></td>
            <td>${escapeHtml(s.real_name)}</td>
            <td>${escapeHtml(s.phone)}</td>
            <td>${escapeHtml(s.campus)}</td>
            <td>${escapeHtml(s.education)}</td>
            <td>${escapeHtml(s.major)}</td>
        </tr>`;
    }).join('');
}

function filterPushStudents() {
    const keyword = (document.getElementById('pushKeyword').value || '').trim().toLowerCase();
    if (!keyword) {
        renderPushStudents(pushStudents);
        return;
    }
    const filtered = pushStudents.filter(s => 
        (s.real_name || '').toLowerCase().includes(keyword) || 
        (s.phone || '').includes(keyword)
    );
    renderPushStudents(filtered);
}

function togglePushStudent(id, checked) {
    if (checked) {
        selectedStudentIds.add(id);
    } else {
        selectedStudentIds.delete(id);
    }
    updateSelectedCount();
}

function toggleAllPushStudents(checked) {
    document.querySelectorAll('.push-student-checkbox').forEach(cb => {
        cb.checked = checked;
        const id = parseInt(cb.value);
        if (checked) {
            selectedStudentIds.add(id);
        } else {
            selectedStudentIds.delete(id);
        }
    });
    updateSelectedCount();
}

function selectAllPushStudents() {
    document.querySelectorAll('.push-student-checkbox').forEach(cb => {
        cb.checked = true;
        selectedStudentIds.add(parseInt(cb.value));
    });
    document.getElementById('selectAllPushStudents').checked = true;
    updateSelectedCount();
}

function deselectAllPushStudents() {
    document.querySelectorAll('.push-student-checkbox').forEach(cb => {
        cb.checked = false;
    });
    selectedStudentIds.clear();
    document.getElementById('selectAllPushStudents').checked = false;
    updateSelectedCount();
}

function updateSelectedCount() {
    document.getElementById('selectedCount').textContent = selectedStudentIds.size;
}

async function submitPush() {
    const jobIds = getSelectedJobIds();
    const studentIds = Array.from(selectedStudentIds);
    
    if (jobIds.length === 0) {
        showToast('请选择岗位', 'warning');
        return;
    }
    if (studentIds.length === 0) {
        showToast('请选择学员', 'warning');
        return;
    }
    
    const formData = new FormData();
    formData.append('csrf_token', '{{ csrf_token }}');
    jobIds.forEach(id => formData.append('job_ids', id));
    studentIds.forEach(id => formData.append('student_ids', id));
    
    try {
        const res = await fetch('{{ url_for("admin.push_do") }}', {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        const data = await res.json();
        if (data.success !== false) {
            showToast('推送成功', 'success');
            bootstrap.Modal.getInstance(document.getElementById('pushJobModal')).hide();
        } else {
            showToast(data.message || '推送失败', 'danger');
        }
    } catch (e) {
        showToast('推送失败', 'danger');
    }
}
</script>
{% endblock %}
