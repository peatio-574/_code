{% extends "base.html" %}

{% block title %}{{ '编辑' if account else '新增' }}账号 - 岗位管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="bi bi-{{ 'pencil' if account else 'person-plus' }}"></i>
                    {{ '编辑' if account else '新增' }}账号
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="username" 
                                   value="{{ account.username if account else '' }}" 
                                   {{ 'readonly' if account else 'required' }}>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ '新' if account else '' }}密码 {{ '' if account else '<span class="text-danger">*</span>' }}</label>
                            <input type="password" class="form-control" name="password" 
                                   {{ '' if account else 'required' }} minlength="6"
                                   placeholder="{{ '留空则不修改' if account else '默认123456' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" class="form-control" name="real_name" 
                                   value="{{ account.real_name if account else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">手机号</label>
                            <input type="text" class="form-control" name="phone" 
                                   value="{{ account.phone if account else '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" name="email" 
                               value="{{ account.email if account else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">操作权限</label>
                        <div class="row">
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="can_manage_jobs" 
                                           id="can_manage_jobs" {% if not account or account.can_manage_jobs %}checked{% endif %}>
                                    <label class="form-check-label" for="can_manage_jobs">岗位管理</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="can_manage_students" 
                                           id="can_manage_students" {% if account and account.can_manage_students %}checked{% endif %}>
                                    <label class="form-check-label" for="can_manage_students">学员管理</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="can_manage_accounts" 
                                           id="can_manage_accounts" {% if account and account.can_manage_accounts %}checked{% endif %}>
                                    <label class="form-check-label" for="can_manage_accounts">账号管理</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" name="can_push_jobs" 
                                           id="can_push_jobs" {% if not account or account.can_push_jobs %}checked{% endif %}>
                                    <label class="form-check-label" for="can_push_jobs">推送岗位</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ '更新' if account else '保存' }}
                        </button>
                        <a href="{{ url_for('admin.accounts_list') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
