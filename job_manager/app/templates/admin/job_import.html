{% extends "base.html" %}

{% block title %}批量导入 - 岗位管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-upload"></i> 批量导入岗位</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <h6><i class="bi bi-info-circle"></i> 导入说明</h6>
                    <ol class="mb-0">
                        <li>请下载导入模板，按格式填写岗位信息</li>
                        <li>必填字段：单位名称、岗位名称</li>
                        <li>截止时间格式：YYYY-MM-DD（如 2024-06-30）</li>
                        <li>党员要求填写"是"或"否"</li>
                        <li>单次最多导入1000条数据</li>
                    </ol>
                </div>

                <div class="mb-4">
                    <a href="{{ url_for('admin.job_template') }}" class="btn btn-outline-primary">
                        <i class="bi bi-download"></i> 下载导入模板
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label">选择Excel文件</label>
                        <input type="file" class="form-control" name="file" accept=".xlsx,.xls" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-upload"></i> 开始导入
                        </button>
                        <a href="{{ url_for('admin.jobs_list') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
