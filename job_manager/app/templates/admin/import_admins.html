{% extends "base.html" %}

{% block title %}导入管理员 - 聘安途岗推系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-upload"></i> 批量导入管理员</h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <h6><i class="bi bi-info-circle"></i> 导入说明</h6>
                    <ul class="mb-0">
                        <li>请下载模板填写数据后上传</li>
                        <li><strong>必填：</strong>姓名、手机号、校区名称</li>
                        <li><strong>选填：</strong>密码（默认手机号后6位）、角色、状态（默认启用）、权限（默认全选）</li>
                        <li>手机号作为登录账号，不可重复</li>
                        <li>校区名称如果不存在会自动创建</li>
                    </ul>
                </div>

                <div class="mb-3">
                    <a href="{{ url_for('admin.template_admins') }}" class="btn btn-outline-success">
                        <i class="bi bi-download"></i> 下载导入模板
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data" id="importForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label">选择Excel文件 <span class="text-danger">*</span></label>
                        <input type="file" class="form-control" name="file" accept=".xlsx,.xls" required id="importFile">
                    </div>
                    <div id="importStatus" class="text-muted small mb-2"></div>
                    <button type="submit" class="btn btn-primary" id="importSubmitBtn">
                        <i class="bi bi-upload"></i> 开始导入
                    </button>
                    <a href="{{ url_for('admin.users_page') }}" class="btn btn-secondary">返回</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('importForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var fileInput = document.getElementById('importFile');
    if (!fileInput.files.length) { showToast('请选择Excel文件', 'warning'); return; }
    var btn = document.getElementById('importSubmitBtn');
    var status = document.getElementById('importStatus');
    btn.disabled = true;
    status.textContent = '正在导入，请稍候...';
    var formData = new FormData(this);
    formData.append('csrf_token', '{{ csrf_token }}');
    fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    }).then(function(res) { return res.json(); })
      .then(function(data) {
        btn.disabled = false;
        status.textContent = '';
        if (data.success) {
            showToast(data.message, 'success');
            setTimeout(function() { window.location.href = '{{ url_for("admin.users_page") }}'; }, 1200);
        } else {
            showToast(data.message || '导入失败', 'danger');
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        status.textContent = '';
        showToast('导入失败，请重试', 'danger');
      });
});
</script>
{% endblock %}
