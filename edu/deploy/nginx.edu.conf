worker_processes  1;

# 使用绝对路径，保证从任意工作目录启动都能加载
error_log  D:/software/nginx-1.23.0/logs/edu_error.log;
pid        D:/software/nginx-1.23.0/logs/edu_nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       D:/software/nginx-1.23.0/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2048m;

    client_body_temp_path D:/software/nginx-1.23.0/temp/client_body_temp;
    proxy_temp_path       D:/software/nginx-1.23.0/temp/proxy_temp;
    fastcgi_temp_path     D:/software/nginx-1.23.0/temp/fastcgi_temp;
    uwsgi_temp_path       D:/software/nginx-1.23.0/temp/uwsgi_temp;
    scgi_temp_path        D:/software/nginx-1.23.0/temp/scgi_temp;

    # 后端上游：FastAPI
    upstream edu_backend {
        server 127.0.0.1:8000;
    }

    server {
        # 本地开发使用 8081，避免与旧 Rust 后端(8080)冲突
        listen       8081;
        server_name  localhost;

        # 前端静态资源
        root   D:/_code/edu/frontend/dist;
        index  index.html;

        # API 反向代理
        location /api/ {
            proxy_pass http://edu_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 静态资源长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
